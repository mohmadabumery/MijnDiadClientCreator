name: Create MijnDiAd Client

on:
  workflow_dispatch:
    inputs:
      client_json:
        description: 'Client JSON payload'
        required: true
        default: '{}'

jobs:
  create-client:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Verify .NET Installation
        run: dotnet --version
        shell: cmd

      - name: Restore dependencies
        run: dotnet restore MijnDiAdClientCreator/MijnDiAdClientCreator.csproj
        shell: cmd

      - name: Build project
        run: dotnet build MijnDiAdClientCreator/MijnDiAdClientCreator.csproj --configuration Release --no-restore
        shell: cmd

      - name: Create JSON file
        run: |
          echo {"salutation":"","firstname":"Mohmad","lastname":"Abumery","gender":"1","date_of_birth":"2025-11-12","date_of_intake":"2026-01-05T12:36:41Z","email":"mohmadabumery@gmail.com","mobilenumber":"","reminder":"1","confirmation":"1","invoice_relation_id":"15","invoice_send_method":"1","is_active":"1","address":{"country":"","zipcode":"rr2131","house_number":"","street":"sad","city":"enscehde"},"invoice_address":{"country":"NL"},"different_post_address":"0","client_attributes":[],"client_group_ids":null,"allow_dubble_email":"0"} > client_data.json
          type client_data.json
        shell: cmd

      - name: Run client creation
        run: dotnet run --project MijnDiAdClientCreator/MijnDiAdClientCreator.csproj -- --json-file client_data.json
        shell: cmd
        env:
          MIJNDIAD_TENANT: ${{ secrets.MIJNDIAD_TENANT }}
          MIJNDIAD_USERNAME: ${{ secrets.MIJNDIAD_USERNAME }}
          MIJNDIAD_PASSWORD: ${{ secrets.MIJNDIAD_PASSWORD }}
          MIJNDIAD_TOTP_SECRET: ${{ secrets.MIJNDIAD_TOTP_SECRET }}

      - name: Workflow Summary
        if: always()
        run: |
          if %ERRORLEVEL%==0 (
            echo ✅ Client successfully created in MijnDiAd EPD
          ) else (
            echo ❌ Failed to create client - check logs above
          )
        shell: cmd
