name: Dynamics → MijnDiAd Automation
on:
  workflow_dispatch:
    inputs:
      dynamics_json:
        description: "JSON payload from Power Automate"
        required: true
        type: string
      questionnaire_ids:
        description: "Comma-separated questionnaire IDs (e.g., 5,4)"
        required: false
        default: "5,4"
        type: string

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Run MijnDiAd Automation
        env:
          MIJNDIAD_SESSION: ${{ secrets.MIJNDIAD_SESSION }}
          MIJNDIAD_XSRF: ${{ secrets.MIJNDIAD_XSRF }}
          MIJNDIAD_TENANT: ${{ secrets.MIJNDIAD_TENANT }}
          MIJNDIAD_QUESTIONNAIRE_IDS: ${{ inputs.questionnaire_ids || secrets.MIJNDIAD_QUESTIONNAIRE_IDS }}
        run: |
          echo "== Running Dynamics → MijnDiAd Automation =="
          set -e
          
          dotnet run \
            --project MijnDiAdClientCreator/MijnDiAdClientCreator.csproj \
            -- \
            --json '${{ inputs.dynamics_json }}' || {
              echo "::error ::Automation failed. Check the logs above."
              exit 1
            }
          
          echo "== Automation completed =="
