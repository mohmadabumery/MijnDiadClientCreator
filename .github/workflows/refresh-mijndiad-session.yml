name: Refresh MijnDiAd Session

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Playwright
        run: |
          dotnet build MijnDiAdClientCreator
          npx playwright install chromium

      - name: Refresh cookies
        env:
          MIJNDIAD_USERNAME: ${{ secrets.MIJNDIAD_USERNAME }}
          MIJNDIAD_PASSWORD: ${{ secrets.MIJNDIAD_PASSWORD }}
          MIJNDIAD_TOTP_SECRET: ${{ secrets.MIJNDIAD_TOTP_SECRET }}
          MIJNDIAD_TENANT: ${{ secrets.MIJNDIAD_TENANT }}
        run: |
          dotnet run --project MijnDiAdClientCreator refresh-session > cookies.json

      - name: Update GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set MIJNDIAD_SESSION --body "$(jq -r '.session' cookies.json)"
          gh secret set MIJNDIAD_XSRF --body "$(jq -r '.xsrf' cookies.json)"
