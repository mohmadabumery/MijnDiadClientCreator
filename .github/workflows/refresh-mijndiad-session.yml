name: Refresh MijnDiAd Session

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v4

      # 2️⃣ Setup .NET
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 3️⃣ Build project
      - name: Build project
        run: dotnet build MijnDiAdClientCreator

      # 4️⃣ Install Playwright browsers
      - name: Install Playwright
        run: |
          cd MijnDiAdClientCreator
          dotnet tool install --global Microsoft.Playwright.CLI
          playwright install chromium

      # 5️⃣ Refresh cookies (human login)
      - name: Refresh cookies
        env:
          MIJNDIAD_USERNAME: ${{ secrets.MIJNDIAD_USERNAME }}
          MIJNDIAD_PASSWORD: ${{ secrets.MIJNDIAD_PASSWORD }}
          MIJNDIAD_TENANT: ${{ secrets.MIJNDIAD_TENANT }}
        run: |
          echo "⚠️ Open browser, login manually, complete OTP, press ENTER"
          dotnet run --project MijnDiAdClientCreator refresh-session > cookies.json

      # 6️⃣ Install GitHub CLI
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install -y gh jq

      # 7️⃣ Authenticate GitHub CLI
      - name: Authenticate GH CLI
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh auth login --with-token <<< "${GH_TOKEN}"

      # 8️⃣ Update GitHub secrets
      - name: Update secrets
        run: |
          gh secret set MIJNDIAD_SESSION --body "$(jq -r '.session' cookies.json)"
          gh secret set MIJNDIAD_XSRF --body "$(jq -r '.xsrf' cookies.json)"
